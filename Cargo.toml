[package]
name = "rw-builder"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
description = "Provides a convenient way to build `std::io::Read`ers and `std::io::Write`rs by chaining transformations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RLangendam/rw-builder"
keywords = ["read", "write", "compression", "encoding", "serde"]
include = ["src/", "LICENSE-*", "README.md", "CHANGELOG.md", "COPYRIGHT.txt"]
categories = [
    "compression",
    "cryptography",
    "encoding",
    "rust-patterns",
    "algorithms",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wincode = { version = "0.6.0", optional = true }
chacha20 = { version = "0.10.1", optional = true }
cipher = { version = "0.5.2", optional = true }
flate2 = { version = "1.1.9", optional = true }
salsa20 = { version = "0.11.0", optional = true }
serde = { version = "1.0.164", features = ["derive"], optional = true }
thiserror = "2.0.18"
zstd = { version = "0.13.1", optional = true }
bzip2 = { version = "0.6.1", optional = true }
lz4_flex = { version = "0.14.0", optional = true }
aes = { version = "0.9.2", optional = true }
ctr = { version = "0.10.1", optional = true }
digest = { version = "0.11.3", optional = true }
sha2 = { version = "0.11.0", optional = true }
sha3 = { version = "0.12.0", optional = true }
crc32fast = { version = "1.5.0", optional = true }
rmp-serde = { version = "1.3.1", optional = true }
base64 = { version = "0.23.0", optional = true }
serde_json = { version = "1.0.149", optional = true }
postcard = { version = "1.1.3", features = ["use-std"], optional = true }

[features]
wincode = ["dep:wincode", "dep:serde"]
chacha20 = ["dep:chacha20", "dep:cipher"]
salsa20 = ["dep:salsa20", "dep:cipher"]
flate2 = ["dep:flate2"]
zstd = ["dep:zstd"]
bzip2 = ["dep:bzip2"]
lz4_flex = ["dep:lz4_flex"]
aes_ctr = ["dep:aes", "dep:ctr", "dep:cipher"]
digest = ["dep:digest"]
sha2 = ["dep:sha2", "digest"]
sha3 = ["dep:sha3", "digest"]
crc32fast = ["dep:crc32fast"]
rmp_serde = ["dep:rmp-serde", "dep:serde"]
base64 = ["dep:base64"]
serde_json = ["dep:serde_json", "dep:serde"]
postcard = ["dep:postcard", "dep:serde"]

[[bench]]
name = "rw_benchmark"
harness = false

[dev-dependencies]
criterion = "0.8.2"

[package.metadata.cargo-all-features]
max_combination_size = 2

[package.metadata.docs.rs]
all-features = true
